[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consentdiff-lab"
version = "1.1.0"
description = "Human and tool workflow consistency reference laboratory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7", "coverage>=7.4"]

[project.scripts]
consentdiff = "consentdiff.cli:main"

[tool.setuptools.packages.find]
include = ["consentdiff*"]

[tool.setuptools.package-data]
consentdiff = ["static/*", "browser_runner.cjs"]

[tool.coverage.run]
source = ["consentdiff"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B905"]  # zip(strict=) is style
